    <body>
        <div id="home" onclick="mostraFormScelta()">

        </div>
        <div id="formscelta">
        <button id="pulsanteric" onclick="mostraRicerca()">Ricerca Un Componente</button>
        <button id="pulsanteelimina" onclick="mostraElimina()">Elimina Un Componente</button>
        <button id="pulsanteaggiungi" onclick="mostraAggiungi()">Aggiungi Un Componente</button>
        </div>
        <div id="eliminaform">
            <h1 style="position: absolute;left: 30%; font-size: 150%; top: 1%;">Cancellazione componente</h1>
            <input name="nomeComponente" type="text" id="testoelimina" oninput="aggiornalista2() " placeholder="Ricerca un componente da eliminare     &#128270">
            <br><br>
            <button onclick="eliminaUtente()" id="bottonecancella">Cancella </button>
            <ul id="lista2"></ul>
        </div>
        <div id="aggiungiform">
            <input type="text" name="nome" id="nome" required placeholder="Nome Componente">
            <input type="text" name="produttore" id="produttore" required placeholder="Produttore">
            <input type="number" name="prezzo" id="prezzo" required placeholder="Prezzo">
            <input type="number" name="watts" id="watts" required placeholder="Watts">
            <input type="number" name="garanziaMesi" id="garanziaMesi" required placeholder="Garanzia (mesi)">
            <input type="button" id="consegna" value="Aggiungi" onclick="aggiungiComponente()">
            <h1 id="titoloformaggiungi">Aggiungi Un Componente</h1>
        </div>
        <div id="ricercaform">
        <h1 style="position: absolute;left: 42%; font-size: 150%; top: 1%;">Ricerca</h1>
        <input type="text" id="ricerca" placeholder="Ricerca un componente                     &#128270" oninput="aggiornalista()">
        <ul id="lista"></ul>
        </div>
        <script>
            function mostraAggiungi()
            {
                document.getElementsByTagName("body")[0].style.backgroundImage = "url('assets/background/backgroundaggiungi.png')";
                document.getElementById("aggiungiform").style.display = "inline";
                document.getElementById("pulsanteric").style.display = "none";
                document.getElementById("pulsanteelimina").style.display = "none";
                document.getElementById("pulsanteaggiungi").style.display = "none";
            }
            async function eliminaUtente() {
                const nomeComponente = document.getElementById("testoelimina").value.toLowerCase();

                const dati = {"nomeComponente": nomeComponente};

                try {
                    const risposta = await fetch("eliminaUtente.php", {
                        method : "POST",
                        headers : {"Content-Type" : "application/json"},
                        body : JSON.stringify(dati) 
                    });
                    const risultato = await risposta.json();
                    if(risposta.status === 200) {
                        alert("Componente cancellato con successo!");
                        location.reload();
                    }
                    else if(risposta.status === 404) {
                        alert("Componente non trovato!");
                    }
                    else {
                        alert("Errore del server");
                    }
                } catch (error) {
                    console.error(error);
                }
            }
            function mostraRicerca()
            {  
                document.getElementsByTagName("body")[0].style.backgroundImage = "url('assets/background/backgroundricerca.png')";
                document.getElementById("ricercaform").style.display = "inline";
                document.getElementById("pulsanteric").style.display = "none";
                document.getElementById("pulsanteelimina").style.display = "none";
                document.getElementById("pulsanteaggiungi").style.display = "none";
            }
            function mostraElimina()
            {  
                document.getElementsByTagName("body")[0].style.backgroundImage = "url('assets/background/backgroundrimuovi.png')";
                document.getElementById("eliminaform").style.display = "inline";
                document.getElementById("pulsanteric").style.display = "none";
                document.getElementById("pulsanteelimina").style.display = "none";
                document.getElementById("pulsanteaggiungi").style.display = "none";
            }
            function mostraFormScelta()
            {
                document.getElementsByTagName("body")[0].style.backgroundImage = "url('assets/background/backgroundhome.png')";
                document.getElementById("pulsanteric").style.display = "inline";
                document.getElementById("pulsanteelimina").style.display = "inline";
                document.getElementById("pulsanteaggiungi").style.display = "inline";
                document.getElementById("ricercaform").style.display = "none";
                document.getElementById("eliminaform").style.display = "none";
                document.getElementById("aggiungiform").style.display = "none";
            }
            const input=document.getElementById("ricerca")
            const lista=document.getElementById("lista")

            async function inizializzadati()
            {
                try 
                {
                    const risposta = await fetch("componenti.json");
                    console.log(risposta.status);
                    componenti = await risposta.json();
                    aggiornalista("");
                } 
                catch (errore) 
                {
                    console.error("errore di caricamento");
                }
            }
            function aggiornalista()
            {
                var testo = input.value.toLowerCase();
                lista.innerHTML = "";
                componenti.forEach(componente =>{
                    const nomecompleto = ""+ componente.nomeComponente +" "+componente.produttore;
                    const nomeLC = nomecompleto.toLowerCase();
                    if(nomeLC.includes(testo))
                    {
                        const li = document.createElement("li");
                        li.innerHTML = nomecompleto;
                        lista.appendChild(li);
                    }
                }); 
            }

            const input2=document.getElementById("testoelimina")
            const lista2=document.getElementById("lista2")
            let componenti = [];

            async function inizializzadati2()
            {
                try 
                {
                    const risposta = await fetch("componenti.json");
                    console.log(risposta.status);
                    componenti = await risposta.json();
                    aggiornalista2("");
                } 
                catch (errore) 
                {
                    console.error("errore di caricamento");
                }
            }
            function aggiornalista2()
            {
                var testo = input2.value.toLowerCase();
                lista2.innerHTML = "";
                componenti.forEach(componente =>{
                    const nomecompleto = ""+ componente.nomeComponente +" "+componente.produttore;
                    const nomeLC = nomecompleto.toLowerCase();
                    if(nomeLC.includes(testo))
                    {
                        const li = document.createElement("li");
                        li.innerHTML = nomecompleto;
                        lista2.appendChild(li);
                    }
                }); 
            }

            async function aggiungiComponente() {
                const nomeComponente = document.getElementById("nome").value;
                const produttore = document.getElementById("produttore").value;
                const prezzo = document.getElementById("prezzo").value;
                const watts = document.getElementById("watts").value;
                const garanziaMesi = document.getElementById("garanziaMesi").value;

                const componente = {nomeComponente,produttore,prezzo,watts,garanziaMesi};

                try {
                    const risposta = await fetch("creaComponente.php", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify(componente)
                    });
                    const risultato = await risposta.json();
                    if(risultato.status === "success") {
                        alert("Componente inserito con successo!");
                        location.href = "index.html";
                    }
                } catch (error) {
                    console.log(error);
                }
            }

            window.onload = () => {
                inizializzadati();
                inizializzadati2();
            };

        </script>
    </body>
</html>
