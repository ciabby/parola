        <script>
            async function eliminaUtente() {
                const email = document.getElementById("testoelimina").value.toLowerCase();

                const dati = {email: nomeComponente};

                try {
                    const risposta = await fetch("eliminaUtente.php", {
                        method : "POST",
                        headers : {"Content-Type" : "application/json"},
                        body : JSON.stringify(dati) 
                    });
                    const risultato = await risposta.json();
                    if(risposta.status === 200) {
                        alert("Utente cancellato con successo!");
                    }
                    else if(risposta.status === 404) {
                        alert("Utente non trovato!");
                    }
                    else {
                        alert("Errore del server");
                    }
                } catch (error) {
                    console.error(error);
                }
            }
            function mostraRicerca()

                document.getElementById("pulsanteelimina").style.display = "none";
            }
            function mostraElimina()
            {  
                document.getElementsByTagName("body")[0].style.backgroundImage = "url('assets/background/backgroundrimuovi.png')";
                document.getElementById("eliminaform").style.display = "inline";
                document.getElementById("pulsanteric").style.display = "none";
                document.getElementById("pulsanteelimina").style.display = "none";
            }
            function mostraFormScelta()
            {

                document.getElementById("ricercaform").style.display = "none";
                document.getElementById("eliminaform").style.display = "none";
            }
            const input=document.getElementById("ricerca")
            const lista=document.getElementById("lista")

            async function inizializzadati()
            {
                try 
                {
                    const risposta = await fetch("componenti.json");
                    console.log(risposta.status);
                    componenti = await risposta.json();
                    aggiornalista("");
                } 
                catch (errore) 
                {
                    console.error("errore di caricamento");
                }
            }
            function aggiornalista()
            {
                var testo = input.value.toLowerCase();
                lista.innerHTML = "";
                componenti.forEach(componente =>{
                    const nomecompleto = ""+ componente.nomeComponente +" "+componente.produttore;
                    const nomeLC = nomecompleto.toLowerCase();
                    if(nomeLC.includes(testo))
                    {
                        const li = document.createElement("li");
                        li.innerHTML = nomecompleto;
                        lista.appendChild(li);
                    }
                }); 
            }
