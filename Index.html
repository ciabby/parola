<html>
    <head>
        <title>Ricerca Componenti</title>
        <style>
            body   
            {
                background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
                background-size: 400% 400%;
                animation: gradient 10s ease infinite;
            }
            @keyframes gradient {
                0% {
                    background-position: 0% 50%;
                }
                50% {
                    background-position: 100% 50%;
                }
                100% {
                    background-position: 0% 50%;
                }
            }
            #formscelta
            {
                position: absolute;
                left: 35%;
                top: 20%;
                height: 75%;
                width: 30%;
                background: rgba(255, 255, 255, 0.2);
                backdrop-filter: blur(16px);
                border-radius: 20px;
                box-shadow: -5px -5px 20px rgb(243, 212, 246),
                            5px 5px 20px rgb(167, 156, 168);
                color:black;
            }
            #titolohome
            {
                position: absolute;
                left: 41%;
                top: 3%;
                font-size: 200%;
                background: rgba(150, 210, 223, 0.487);
                backdrop-filter: blur(16px);
                box-shadow: -5px -5px 15px rgb(255, 255, 255),
                            5px 5px 15px rgb(167, 156, 168);
                border-radius: 20px;
            }
            #titoloformscelta
            {
                position: absolute;
                left: 30%;
                top: 0%;
                font-size: 150%;
                text-decoration: underline;
                text-decoration-color: black;
                text-decoration-thickness: 2px;
                text-underline-offset: 4px;
            }
            #ricerca
            {
                position: absolute;
                left: 25%;
                top: 15%;
                height: 7%;
                width: 55%;
                border-radius: 20px;
                color: black;
                padding-left: 20px;
            }
            #ricerca::placeholder
            {
                font-family: arial;
                font-size: 15px;
                color: black;
            }
            #lista 
            {
                padding-left: 30px; 
                padding-right: 20px;
                padding-top: 160px; 
                font-size: 18px;
                list-style-position: outside; 
                color: black;
                margin: 0;
            }

            #lista li 
            {
                margin-bottom: 10px; 
                word-wrap: break-word; 
            }
            #ricercaform 
            {
                position: absolute;
                left: 35%;
                top: 20%;
                background: rgba(150, 210, 223, 0.487);
                backdrop-filter: blur(16px);
                height: 78%;
                width: 30%;
                border-radius: 20px;
                overflow-y: auto; 
                overflow-x: hidden; 
                display: none;
            }
            #bottonemostrar
            {
                position: absolute;
                left: 15%;
                top: 20%;
                height: 10%;
                width: 70%;
                background: rgba(255, 255, 255, 0.2);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                color:black;
                font-size: 150%;
            }
        </style>
    </head>
    <body>
        <h1 id="titolohome">⚙️Componenti⚙️</h1>
        <div id="formscelta">
            <h1 id="titoloformscelta">Cosa Vuoi Fare:</h1>
            <button id="bottonemostrar" onclick="mostraRicerca()">Ricerca Componenti</button>
        </div>
        <div id="ricercaform">
        <h1 style="position: absolute;left: 42%; font-size: 150%; top: 1%;">Ricerca</h1>
        <input type="text" id="ricerca" placeholder="Ricerca un componente  &#128270" oninput="aggiornalista()">
        <ul id="lista"></ul>
        </div>
        <script>
            function mostraRicerca()
            {  
                document.getElementById("ricercaform").style.display = "inline";
                document.getElementById("formscelta").style.display = "none";
            }
            const input=document.getElementById("ricerca")
            const lista=document.getElementById("lista")
            let componenti = [];

            window.onload = inizializzadati();

            async function inizializzadati()
            {
                try 
                {
                    const risposta = await fetch("componenti.json");
                    console.log(risposta.status);
                    componenti = await risposta.json();
                    aggiornalista("");
                } 
                catch (errore) 
                {
                    console.error("errore di caricamento");
                }
            }
            function aggiornalista()
            {
                var testo = input.value.toLowerCase();
                lista.innerHTML = "";
                componenti.forEach(componente =>{
                    const nomecompleto = ""+ componente.nomeComponente +" "+componente.produttore;
                    const nomeLC = nomecompleto.toLowerCase();
                    if(nomeLC.includes(testo))
                    {
                        const li = document.createElement("li");
                        li.innerHTML = nomecompleto;
                        lista.appendChild(li);
                    }
                }); 
            }

        </script>
    </body>
</html>
